name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Board list is read from boards/ — never hardcoded (matches the Makefile).
  discover:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - id: list
        run: |
          boards=$(for d in boards/*/sdkconfig.defaults; do
                     b=${d#boards/}; echo "${b%/sdkconfig.defaults}"
                   done | jq -R . | jq -cs .)
          echo "boards=$boards" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.discover.outputs.boards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - name: ESP-IDF revision
        id: idf
        run: echo "sha=$(git rev-parse HEAD:esp-idf)" >> "$GITHUB_OUTPUT"

      # The IDF's own component submodules are ~20 more clones; cache the whole
      # checkout, git dirs included, so a warm run fetches nothing.
      - name: Cache ESP-IDF checkout
        id: idf-src
        uses: actions/cache@v6
        with:
          path: |
            esp-idf
            .git/modules/esp-idf
          key: esp-idf-src-${{ steps.idf.outputs.sha }}

      - name: Fetch pinned ESP-IDF
        if: steps.idf-src.outputs.cache-hit != 'true'
        run: |
          git submodule update --init --depth 1 esp-idf
          git -C esp-idf submodule update --init --depth 1 --recursive

      # Cache the installed toolchain (~/.espressif) keyed on the pinned IDF, so
      # install.sh becomes a near-instant no-op on subsequent runs.
      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        with:
          path: ~/.espressif
          key: esp-tools-${{ runner.os }}-${{ steps.idf.outputs.sha }}-esp32s3

      # Cache the component-manager downloads keyed on the manifests. Per-board:
      # each board declares its own dependencies, so the component set differs
      # per board and the board's own manifest has to be part of the key.
      - name: Cache managed components
        uses: actions/cache@v6
        with:
          path: managed_components
          key: managed-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('src/main/idf_component.yml', format('boards/{0}/idf_component.yml', matrix.board)) }}

      - name: Install ESP-IDF tools
        run: ./esp-idf/install.sh esp32s3

      # The version comes from src/main/version.h; releases are built by
      # release.yml, which checks the tag against it first.
      - name: Build ${{ matrix.board }}
        run: |
          . ./esp-idf/export.sh
          make ${{ matrix.board }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: betaflight-bridge-${{ matrix.board }}
          path: dist/betaflight-bridge-${{ matrix.board }}-*.bin
