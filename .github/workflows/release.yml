name: release

# Publishing a release builds every board and attaches its images. The release
# itself is created by hand (as betaflight does), so the notes can be reviewed
# before anything ships.
#
#   1. bump the CalVer components in src/main/version.h and merge that
#   2. gh release create "$(make version)" --generate-notes --draft
#   3. publish the draft
#
# Step 2's tag must equal `make version`; the guard below refuses anything else
# rather than shipping an image whose filename contradicts its tag.
on:
  release:
    types: [published]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Tag must match src/main/version.h
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(make version)
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag '$TAG' does not match src/main/version.h ('$version')"
            exit 1
          fi
          echo "releasing $version"

  # Board list is read from boards/ — never hardcoded (matches the Makefile).
  discover:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - id: list
        run: echo "boards=$(make -s list | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the images to the release
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJson(needs.discover.outputs.boards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch pinned ESP-IDF
        id: idf
        run: |
          git submodule update --init --depth 1 esp-idf
          git -C esp-idf submodule update --init --depth 1 --recursive
          echo "sha=$(git -C esp-idf rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ESP-IDF tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: esp-tools-${{ runner.os }}-${{ steps.idf.outputs.sha }}-esp32s3

      - name: Cache managed components
        uses: actions/cache@v4
        with:
          path: managed_components
          key: managed-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('src/main/idf_component.yml', format('boards/{0}/idf_component.yml', matrix.board)) }}

      - name: Install ESP-IDF tools
        run: ./esp-idf/install.sh esp32s3

      - name: Build ${{ matrix.board }}
        run: |
          . ./esp-idf/export.sh
          make ${{ matrix.board }}

      - name: Attach images to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/betaflight-bridge-${{ matrix.board }}-*.bin --clobber
